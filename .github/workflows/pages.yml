name: Publier le site

# Le site est servi par GitHub Pages depuis la branche gh-pages.
# À chaque poussée sur main, ce workflow synchronise gh-pages,
# ce qui déclenche le déploiement automatique de Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchroniser gh-pages avec main
        run: git push --force origin HEAD:gh-pages
